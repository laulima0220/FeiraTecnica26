<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        :root {
            --creme: #FDF1DB;
            --bege: #DFD5C6;

            --azul-claro: #A6CBD3;
            --azul-medio: #4F8FAA;

            --verde-salvia: #96AB88;
            --verde-musgo: #597B60;

            --verde-claro: #B8C8AD;
            --verde-escuro: #3F5F47;

            --fundo: #F8F4EC;
            --branco: #FFFFFF;

            --texto: #2F3D35;
            --texto-claro: #6F7D73;

            --borda: #D4D8CC;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, var(--fundo), var(--creme));
            color: var(--texto);
        }

        .cabecalho {
            position: relative;
            padding: 28px 24px 24px;
            background: var(--verde-musgo);
            color: var(--branco);
            text-align: center;
            box-shadow: 0 5px 18px rgba(63, 95, 71, 0.25);
        }

        .cabecalho h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .cabecalho p {
            margin: 10px 0 0;
            color: var(--creme);
            font-size: 16px;
        }

        .botao-voltar {
            position: absolute;
            top: 50%;
            left: 24px;
            transform: translateY(-50%);

            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 11px 18px;
            border-radius: 999px;

            background: linear-gradient(135deg, var(--azul-claro), var(--azul-medio));
            color: var(--branco);

            font-size: 15px;
            font-weight: bold;
            text-decoration: none;

            box-shadow: 0 5px 12px rgba(79, 143, 170, 0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .botao-voltar:hover {
            transform: translateY(calc(-50% - 3px));
            filter: brightness(1.08);
            box-shadow: 0 8px 18px rgba(79, 143, 170, 0.35);
        }

        .botao-voltar:focus-visible {
            outline: 3px solid var(--verde-salvia);
            outline-offset: 3px;
        }

        .botao-voltar svg {
            flex-shrink: 0;
        }

        .conteudo-mapa {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 24px 32px;
        }

        #mapa {
            height: 600px;
            border: 1px solid var(--borda);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(63, 95, 71, 0.16);
        }

        @media (max-width: 700px) {
            .cabecalho {
                padding: 22px 18px;
            }

            .cabecalho h1 {
                margin-top: 58px;
                font-size: 26px;
            }

            .botao-voltar {
                top: 18px;
                left: 18px;
                transform: none;
            }

            .botao-voltar:hover {
                transform: translateY(-3px);
            }

            .conteudo-mapa {
                margin-top: 22px;
                padding: 0 16px 24px;
            }

            #mapa {
                height: 520px;
            }
        }
    </style>
</head>
<body>

    <header class="cabecalho">
        <a href="/" class="botao-voltar">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16" aria-hidden="true">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
            </svg>
            Voltar
        </a>

        <h1>{{ titulo }}</h1>
        <p>{{ passeios|length }} ponto(s) encontrado(s)</p>
    </header>

    <main class="conteudo-mapa">
        <div id="mapa"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Lista de pontos que veio do MongoDB
        var passeios = {{ passeios|tojson }};

        var mapa = L.map('mapa');

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(mapa);

        var pontos = [];

        // Para cada ponto, cria um marcador
        passeios.forEach(function (p) {
            var lat = p.local.coordinates[1];
            var lon = p.local.coordinates[0];

            pontos.push([lat, lon]);

            L.marker([lat, lon])
                .addTo(mapa)
                .bindPopup(
                    "<b>" + p.local.nome + "</b><br>" +
                    "📍 " + p.endereco + "<br>" +
                    "📂 " + p.categoria + "<br>" +
                    "📃 " + p.descricao
                );
        });

        // Ajusta o zoom para mostrar todos os pontos
        if (pontos.length > 0) {
            mapa.fitBounds(pontos, { padding: [30, 30] });
        } else {
            mapa.setView([-23.1896, -45.8841], 12);
        }
    </script>

</body>
</html>
