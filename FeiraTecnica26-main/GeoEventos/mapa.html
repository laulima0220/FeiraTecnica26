<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Eventos</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>

        #mapa {
            height: 600px;
        }

        #resultado {
            padding: 15px;
            font-size: 20px;
        }

    </style>

</head>

<body>

    <h1>Eventos !!!!</h1>

    <div id="mapa"></div>

    <div id="resultado">
        {{MENSAGEM}}
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        var latitude = Number("LATITUDE_AQUI");
        var longitude = Number("LONGITUDE_AQUI");

        var mapa = L.map('mapa').setView(
            [latitude, longitude],
            13
        );

        L.tileLayer(
             'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
         {
               attribution: 'Tiles &copy; Esri'
         }
        ).addTo(mapa);

        L.marker([latitude, longitude])
            .addTo(mapa)
            .bindPopup("<b>Local pesquisado</b>")
            .openPopup();

        // MARCADORES_AQUI

    </script>

</body>

</html>
